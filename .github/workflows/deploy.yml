# main → Cloudflare Workers 자동 배포 (BE-2).
#
# **원격 D1 마이그레이션은 여기서 돌리지 않는다.** push마다 스키마가 바뀌면
# 되돌리기가 어렵고, 마이그레이션은 배포와 달리 되돌릴 수 없는 작업이다.
# `npm run db:migrate:remote`는 사람이 배포 전에 직접 돌린다.
#
# 비밀값(DOC_URL_SECRET·GOOGLE_CLIENT_*)은 Cloudflare에 `wrangler secret`으로
# 저장돼 있어 빌드에는 필요 없다.
name: Deploy

on:
  push:
    branches: [main]
  # 배포만 다시 돌리고 싶을 때(예: 시크릿을 바꾼 뒤) 손으로 실행한다.
  workflow_dispatch:

# 배포는 겹치면 안 된다 — 나중 것이 먼저 끝나면 옛 산출물이 최신이 된다.
# CI와 달리 진행 중인 것을 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 검증을 여기서 한 번 더 돌린다. CI 워크플로와 중복이지만, 배포 잡이
      # 자기 산출물을 스스로 검증하지 않으면 "CI는 통과했는데 배포된 건 다른 것"이
      # 될 수 있다(두 잡이 각자 checkout한다).
      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      # 시크릿이 없으면 조용히 넘어가지 않고 사유를 남기며 실패한다 —
      # "배포가 안 됐는데 초록불"이 가장 나쁜 상태다.
      - name: 배포 자격 확인
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 또는 CLOUDFLARE_ACCOUNT_ID가 저장소 시크릿에 없습니다. Settings → Secrets and variables → Actions에서 등록하세요."
            exit 1
          fi

      - name: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
